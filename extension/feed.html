<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Today's reading</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="app.css">
</head>
<body data-page="feed">
  <div class="sky" aria-hidden="true">
    <div class="orb o1"></div>
    <div class="orb o2"></div>
    <div class="orb o3"></div>
    <div class="grain"></div>
  </div>

  <main class="feed-main">
    <section class="news" id="news">
      <header class="feed-head">
        <div>
          <h1 class="feed-title">Today's reading</h1>
          <p class="feed-date" id="feed-date"></p>
        </div>
        <button class="news-edit" id="news-edit" type="button" aria-expanded="false"></button>
      </header>
      <div class="news-topics-wrap" id="news-topics-wrap">
        <div class="news-topics-inner">
          <div class="news-topics" id="news-topics" role="group" aria-label="Topics"></div>
          <p class="news-hint">Add any RSS feed with <code>tab news add &lt;url&gt;</code></p>
        </div>
      </div>
      <ol class="news-list" id="news-list"></ol>
      <div class="news-foot">
        <button class="news-more" id="news-more" type="button" hidden></button>
        <span class="news-when" id="news-when"></span>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" hidden></div>
  <script src="app.js"></script>
</body>
</html>

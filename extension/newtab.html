<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Tab</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="app.css">
</head>
<body data-page="newtab">
  <div class="sky" aria-hidden="true">
    <div class="orb o1"></div>
    <div class="orb o2"></div>
    <div class="orb o3"></div>
    <div class="grain"></div>
  </div>

  <main>
    <header class="hero">
      <div class="time"><span id="time"></span><span class="weather" id="weather" hidden></span></div>
      <h1 class="greet" id="greet"></h1>
      <p class="brief" id="brief" hidden></p>
      <form class="search" id="search" role="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
        <input id="q" name="q" type="search" placeholder="Search the web" autocomplete="off" spellcheck="false" autofocus>
      </form>
      <nav class="ask" id="ask" aria-label="Ask an AI"></nav>
      <nav class="sites" id="sites" aria-label="Frequently visited" hidden></nav>
    </header>

    <div class="notice" id="notice" hidden>
      <span class="dot"></span>
      <span class="notice-text" id="notice-text"></span>
      <button class="x" id="notice-x" aria-label="Dismiss">
        <svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7 7 17"/></svg>
      </button>
    </div>

    <div class="column" id="column" aria-live="polite"></div>


    <div class="resting" id="resting" hidden>
      <p class="resting-title">Your agents are resting.</p>
      <p class="resting-sub" id="resting-sub"></p>
    </div>
  </main>

  <div class="usage" id="usage" hidden>
    <button type="button" class="usage-row" id="usage-row" aria-expanded="false" aria-controls="usage-more" aria-label="Agent plan usage. Show details"></button>
    <div class="usage-more" id="usage-more" hidden></div>
  </div>

  <div class="corner" id="corner">
    <div class="look-switch" id="look-switch" role="radiogroup" aria-label="Background">
      <button type="button" role="radio" aria-checked="false" data-look="photo" title="Nature photo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18.5l5.5-7 3.5 4.2 2.5-3 6.5 5.8z"/><circle cx="16.5" cy="7.5" r="1.8"/></svg>
      </button>
      <button type="button" role="radio" aria-checked="false" data-look="sky" title="Gradient sky">
        <svg viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="look-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="currentColor" stop-opacity=".15"/><stop offset="1" stop-color="currentColor"/></linearGradient></defs><circle cx="12" cy="12" r="7.5" fill="url(#look-g)"/></svg>
      </button>
    </div>
    <button class="reading-toggle" id="reading-toggle" aria-pressed="false" title="Today's reading (⌥⇧N)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5c2.6-.9 5.3-.6 8 1 2.7-1.6 5.4-1.9 8-1v13c-2.6-.9-5.3-.6-8 1-2.7-1.6-5.4-1.9-8-1z"/><path d="M12 6.5v13"/></svg>
      <span>Today's reading</span>
    </button>
  </div>
  <aside class="drawer" id="drawer" aria-label="Today's reading" hidden></aside>

  <dialog class="setup" id="setup" aria-labelledby="setup-title">
    <button class="x setup-close" id="setup-close" type="button" aria-label="Close" title="Close (Esc)"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7 7 17"/></svg></button>
    <h2 class="setup-title" id="setup-title">Let your agent set up this tab</h2>
    <p class="setup-sub">Paste this into Claude Code, Codex or any agent in your terminal. It asks what you want to see here and how often to refresh, then sets it up and keeps it current.</p>
    <div class="setup-prompt">
      <p id="setup-text"></p>
      <button class="setup-copy" id="setup-copy" type="button" autofocus>Copy</button>
    </div>
    <button class="setup-skip" id="setup-skip" type="button">I'll do it myself</button>
  </dialog>

  <div class="toast" id="toast" role="status" hidden></div>

  <button class="agent-hint" id="agent-hint" hidden title="Copy, then paste it to your agent"></button>

  <footer class="status" id="status" role="button" tabindex="0" title="Set up or change what your agents show here"><span class="pulse"></span><span id="status-text">connecting</span></footer>

  <script src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Tab</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="app.css">
</head>
<body data-page="newtab">
  <div class="sky" aria-hidden="true">
    <div class="orb o1"></div>
    <div class="orb o2"></div>
    <div class="orb o3"></div>
    <div class="grain"></div>
  </div>

  <main>
    <header class="hero">
      <div class="time" id="time"></div>
      <h1 class="greet" id="greet"></h1>
      <p class="brief" id="brief" hidden></p>
      <form class="search" id="search" role="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
        <input id="q" name="q" type="search" placeholder="Search the web" autocomplete="off" spellcheck="false" autofocus>
      </form>
      <nav class="ask" id="ask" aria-label="Ask an AI"></nav>
    </header>

    <div class="notice" id="notice" hidden>
      <span class="dot"></span>
      <span class="notice-text" id="notice-text"></span>
      <button class="x" id="notice-x" aria-label="Dismiss">
        <svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7 7 17"/></svg>
      </button>
    </div>

    <div class="column" id="column" aria-live="polite"></div>


    <div class="resting" id="resting" hidden>
      <p class="resting-title">Your agents are resting.</p>
      <p class="resting-sub" id="resting-sub"></p>
    </div>
  </main>

  <div class="usage" id="usage" aria-label="Agent plan usage" hidden></div>

  <button class="reading-toggle" id="reading-toggle" aria-pressed="false" title="Today's reading (⌥⇧N)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5c2.6-.9 5.3-.6 8 1 2.7-1.6 5.4-1.9 8-1v13c-2.6-.9-5.3-.6-8 1-2.7-1.6-5.4-1.9-8-1z"/><path d="M12 6.5v13"/></svg>
    <span>Today's reading</span>
  </button>
  <aside class="drawer" id="drawer" aria-label="Today's reading" hidden></aside>

  <div class="toast" id="toast" role="status" hidden></div>

  <button class="agent-hint" id="agent-hint" hidden title="Copy, then paste it to your agent"></button>

  <footer class="status" id="status"><span class="pulse"></span><span id="status-text">connecting</span></footer>

  <script src="app.js"></script>
</body>
</html>
